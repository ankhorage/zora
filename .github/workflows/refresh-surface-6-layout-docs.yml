name: Refresh Surface 6 Layout Docs

on:
  push:
    branches:
      - refactor/surface-6-layout-primitives

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/surface-6-layout-primitives

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Paradox documentation
        run: bun run docs

      - name: Format generated documentation
        run: bun run format

      - name: Remove temporary workflow
        run: rm .github/workflows/refresh-surface-6-layout-docs.yml

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "docs: refresh Surface 6 layout reference"
          git push origin HEAD:refactor/surface-6-layout-primitives
