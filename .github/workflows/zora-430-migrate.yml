name: ZORA 430 migrate

on:
  push:
    branches:
      - refactor/surface-7-form-list
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/surface-7-form-list
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install current dependencies
        run: bun install --frozen-lockfile
      - name: Apply migration
        run: bun scripts/migrate-zora-430-v2.ts
      - name: Install Surface 7 and refresh lockfile
        run: bun install
      - name: Remove migration tooling
        run: rm scripts/migrate-zora-430.ts scripts/migrate-zora-430-v2.ts .github/workflows/zora-430-migrate.yml
      - name: Format
        run: bun run format
      - name: Build
        run: bun run build
      - name: Commit migration
        run: |
          git config user.name "Fabio Gartenmann"
          git config user.email "137318798+artiphishle@users.noreply.github.com"
          git add -A
          git commit -m "refactor(foundations): align with surface capabilities"
          git push origin HEAD:refactor/surface-7-form-list
