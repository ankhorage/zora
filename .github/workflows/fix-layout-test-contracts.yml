name: Fix Layout Test Contracts

on:
  push:
    branches:
      - refactor/surface-6-layout-primitives

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/surface-6-layout-primitives

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate stale layout test contracts
        run: python3 .github/fix_layout_test_contracts.py

      - name: Format
        run: bun run format

      - name: Lint
        run: bun run lint

      - name: Knip
        run: bun run knip:check

      - name: Test
        run: bun test src

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-layout-test-contracts.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "test(layout): align contracts with Surface 6"
          git push origin HEAD:refactor/surface-6-layout-primitives
