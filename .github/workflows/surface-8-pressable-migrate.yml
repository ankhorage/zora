name: Surface 8 Pressable migration

on:
  push:
    branches:
      - refactor/surface-8-pressable
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/surface-8-pressable
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update Surface dependency and lockfile
        run: bun add @ankhorage/surface@^8.0.0

      - name: Assert removed Surface API is gone
        run: |
          ! grep -R -n -E '\bButtonBase(Props)?\b' src examples test-fixtures scripts 2>/dev/null
          node -e "const p=require('./package.json'); if (p.dependencies?.['@ankhorage/surface'] !== '^8.0.0') process.exit(1)"

      - name: Autofix lint
        run: bun run lint:fix

      - name: Format
        run: bun run format

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Knip
        run: bun run knip:check

      - name: Tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Validate examples
        run: bun run examples:validate

      - name: Validate Expo candidate
        run: bun run expo:candidate

      - name: Regenerate Paradox docs
        run: bun run docs

      - name: Reformat generated docs
        run: bun run format

      - name: Remove temporary migration workflow
        run: rm .github/workflows/surface-8-pressable-migrate.yml

      - name: Commit validated migration
        run: |
          git config user.name "Fabio Gartenmann"
          git config user.email "137318798+artiphishle@users.noreply.github.com"
          git add -A
          git commit -m "refactor(interaction): migrate to Surface Pressable"
          git push origin HEAD:refactor/surface-8-pressable
