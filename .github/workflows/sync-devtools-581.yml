name: Sync Devtools 2.0.12 migration

on:
  push:
    branches:
      - refactor/581-remove-plugin-api

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/581-remove-plugin-api
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bunx @ankhorage/ankh devtools skills sync .
      - name: Commit synchronized dependency state
        shell: bash
        run: |
          if git diff --quiet -- bun.lock .agents; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock .agents
          git commit -m "chore(zora): sync Devtools managed skills"
          git push origin HEAD:refactor/581-remove-plugin-api
