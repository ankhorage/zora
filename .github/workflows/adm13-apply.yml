name: ADM-13 ZORA Recipe Runtime

on:
  push:
    branches:
      - adm13/theme-recipe-runtime

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply migration
        run: |
          python3 scripts/adm13_apply.py
          python3 scripts/adm13_fix.py
          python3 scripts/adm13_crash_fix.py

      - name: Install and format source
        run: |
          bun install
          bun run format
          bun run lint:fix

      - name: Commit product source locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/adm13-apply.yml scripts/adm13_apply.py scripts/adm13_fix.py scripts/adm13_crash_fix.py
          git commit -m 'Resolve ZORA theme recipe overrides'

      - name: Validate
        run: |
          bun run build
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run docs
          bun run format
          if grep -R -n -E '/home/runner/|/Users/' paradox README.md; then
            echo 'Generated docs contain machine-specific absolute paths.' >&2
            exit 1
          fi
          bun run format:check
          bun run changeset:status

      - name: Commit generated artifacts and cleanup
        run: |
          git rm .github/workflows/adm13-apply.yml scripts/adm13_apply.py scripts/adm13_fix.py scripts/adm13_crash_fix.py
          git add -A
          git commit -m 'Refresh ZORA theme recipe documentation'
          git push
