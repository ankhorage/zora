name: ZORA 430 gate fix

on:
  push:
    branches:
      - refactor/surface-7-form-list

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/surface-7-form-list
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply gate fixes
        run: bun scripts/fix-zora-430-gates.ts
      - name: Autofix source lint
        run: bun run lint:fix
      - name: Autofix changed example imports
        run: >-
          bunx ankhorage-eslint
          examples/expo-showcase/app/patterns.tsx
          examples/expo-showcase/app/sections/componentForms.tsx
          'examples/food_drink/restaurant/app/(tabs)/reservations.tsx'
          'examples/shopping_commerce/marketplace/app/(tabs)/sell.tsx'
          --config eslint.examples.config.mjs
          --fix
          --max-warnings=0
      - name: Format
        run: bun run format
      - name: Remove temporary tooling
        run: rm scripts/fix-zora-430-gates.ts .github/workflows/zora-430-gate-fix.yml
      - name: Validate Knip
        run: bun run knip:check
      - name: Run tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Validate examples
        run: bun run examples:validate
      - name: Commit fixes
        run: |
          git config user.name "Fabio Gartenmann"
          git config user.email "137318798+artiphishle@users.noreply.github.com"
          git add -A
          git commit -m "fix(foundations): align migration gates"
          git push origin HEAD:refactor/surface-7-form-list
