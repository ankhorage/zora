name: Fix Surface 6 Example Lint

on:
  push:
    branches:
      - refactor/surface-6-layout-primitives

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/surface-6-layout-primitives

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply example lint fixes
        run: bunx ankhorage-eslint examples --config eslint.examples.config.mjs --fix --max-warnings=0

      - name: Format
        run: bun run format

      - name: Validate examples
        run: bun run examples:validate

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-example-layout-lint.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(examples): align Surface 6 imports"
          git push origin HEAD:refactor/surface-6-layout-primitives
