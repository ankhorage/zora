name: Renovate

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: renovate-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read
  statuses: read

jobs:
  changeset:
    if: >-
      (github.actor == 'renovate[bot]' || github.actor == 'ankhorage-renovate-sync[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    uses: ankhorage/renovate/.github/workflows/changeset.yml@d77a1e705ad2922810b91141d550bd82b86fa6bd
    with:
      renovate_sync_client_id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
    secrets:
      renovate_sync_private_key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
