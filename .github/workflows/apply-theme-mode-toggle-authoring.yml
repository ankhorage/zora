name: Apply theme mode toggle authoring

on:
  push:
    branches:
      - theme-mode-toggle-authoring
    paths:
      - .github/workflows/apply-theme-mode-toggle-authoring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: theme-mode-toggle-authoring
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Apply focused changes
        run: python3 .github/scripts/apply-theme-mode-toggle-authoring.py
      - name: Format changed source
        run: |
          bun install --frozen-lockfile
          bun run format
      - name: Commit product diff
        run: |
          git rm .github/scripts/apply-theme-mode-toggle-authoring.py
          git rm .github/workflows/apply-theme-mode-toggle-authoring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .changeset
          git commit -m "Make theme mode toggle authorable"
          git push origin HEAD:theme-mode-toggle-authoring
