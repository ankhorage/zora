name: Validate ADM 3 Heading authoring

on:
  push:
    branches:
      - agent/adm-3-heading-authoring-metadata

permissions:
  contents: write

concurrency:
  group: adm-3-heading-authoring-metadata
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/adm-3-heading-authoring-metadata

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate and format
        run: |
          bun run lint:fix
          bun run docs
          bun run format

      - name: Build
        run: bun run build

      - name: Validate repository
        run: bunx @ankhorage/ankh doctor validate .

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Knip
        run: bun run knip

      - name: Tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Changeset status
        run: bun run changeset:status

      - name: Package smoke
        run: npm pack --dry-run

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-adm3-heading-authoring.yml
          git add -A
          git commit -m "feat: classify Heading authoring metadata"
          git push origin HEAD:agent/adm-3-heading-authoring-metadata
