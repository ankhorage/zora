name: Fix Platform Acceptance

on:
  push:
    branches:
      - refactor/surface-6-layout-primitives

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/surface-6-layout-primitives

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate platform acceptance fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test-fixtures/platformAcceptance.test.tsx')
          text = path.read_text()
          text = text.replace("const { Container } = await import('../src/features/layout/adapters/inbound/Container');\n", '')
          text = text.replace("const { Grid } = await import('../src/features/layout/adapters/inbound/Grid');\n", '')
          text = text.replace("const { Show } = await import('../src/foundation/Show');\n", '')
          text = text.replace("const { AppShell } = await import('../src/layout/app-shell/AppShell');\n", '')
          text = text.replace("const { ContentRail } = await import('../src/features/layout/public');\n", '')
          marker = "const { KeyboardAvoidingView } = await import('../src/features/keyboard-avoiding-view/public');\n"
          replacement = marker + "const { ContentRail } = await import('../src/features/content-rail/public');\nconst { AppShell, Grid, View } = await import('../src/features/layout/public');\n"
          text = text.replace(marker, replacement)
          text = text.replace("describe('Surface 5 icon integration', () => {", "describe('Surface icon integration', () => {")
          text = text.replace(
              '<Container maxWidth={{ base: 640, md: 960 }} px={{ base: 12, md: 24 }} testID="container">',
              '<View maxWidth={{ base: 640, md: 960 }} px={{ base: 12, md: 24 }} testID="container">',
          )
          text = text.replace(
              '''          <Show
            fallback={<ReactNativeWeb.Text>static-fallback</ReactNativeWeb.Text>}
            when={{ base: false, md: true }}
          >
            <ReactNativeWeb.Text>wide-content</ReactNativeWeb.Text>
          </Show>
        </Container>''',
              '''          <ReactNativeWeb.Text>responsive-content</ReactNativeWeb.Text>
        </View>''',
          )
          text = text.replace("  expect(markup).toContain('static-fallback');\n  expect(markup).not.toContain('wide-content');\n", "  expect(markup).toContain('responsive-content');\n")
          path.write_text(text)
          PY

      - name: Format fixture
        run: bun run format

      - name: Verify fixture
        run: |
          bun run knip:check
          bun test test-fixtures/platformAcceptance.test.tsx

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-platform-acceptance.yml

      - name: Commit fixture migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "test(layout): migrate platform acceptance fixture"
          git push origin HEAD:refactor/surface-6-layout-primitives
