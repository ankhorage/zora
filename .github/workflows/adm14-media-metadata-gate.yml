name: ADM-14 ZORA Media Metadata Gate

on:
  push:
    branches:
      - agent/adm14-media-metadata

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply canonical media metadata integration
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['dependencies']['@ankhorage/contracts'] = '^7.6.0'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          bindable_path = Path('src/metadata/bindableComponentMeta.ts')
          bindable = bindable_path.read_text()
          import_anchor = "import type { UiComponentMetaRegistry } from '@ankhorage/contracts';\n"
          image_import = "\nimport { imageMeta } from '../components/image/meta';\n"
          if image_import.strip() not in bindable:
              bindable = bindable.replace(import_anchor, import_anchor + image_import, 1)
          start = bindable.index('  Image: {')
          end = bindable.index('  Input: {', start)
          image_block = '\n'.join([
              '  Image: {',
              '    ...imageMeta,',
              '    bindings: {',
              '      props: {',
              '        source: {',
              "          label: 'Source',",
              "          description: 'Dynamic image source or asset descriptor.',",
              '          value: {',
              "            type: 'imageAsset',",
              '            fields: [',
              "              { path: 'uri', type: 'string', label: 'URI' },",
              "              { path: 'width', type: 'number', label: 'Width' },",
              "              { path: 'height', type: 'number', label: 'Height' },",
              "              { path: 'alt', type: 'string', label: 'Alt text' },",
              '            ],',
              '          },',
              '          acceptsFallback: true,',
              '          acceptsTransforms: true,',
              '        },',
              '      },',
              '    },',
              '  },',
              '',
          ])
          bindable = bindable[:start] + image_block + bindable[end:]
          bindable_path.write_text(bindable)

          component_test_path = Path('src/metadata/componentMeta.test.ts')
          component_test = component_test_path.read_text()
          leaf_anchor = "      'Heading',\n      'Divider',"
          if "      'Image',\n" not in component_test:
              component_test = component_test.replace(
                  leaf_anchor,
                  "      'Heading',\n      'Image',\n      'Divider',",
                  1,
              )
          image_test = '\n'.join([
              "  test('Image is a direct manifest leaf with canonical media authoring metadata', () => {",
              '    expect(ZORA_COMPONENT_META.Image.directManifestNode).toBe(true);',
              '    expect(ZORA_COMPONENT_META.Image.allowedChildren).toEqual([]);',
              '    expect(ZORA_COMPONENT_META.Image.props.source).toEqual({',
              "      type: 'media',",
              "      category: 'Content',",
              "      label: 'Source',",
              "      mediaKinds: ['image'],",
              "      authoring: { authority: 'instance' },",
              '    });',
              "    expect(ZORA_COMPONENT_META.Image.props.alt?.authoring).toEqual({ authority: 'instance' });",
              '  });',
              '',
              '',
          ])
          test_anchor = "  test('ThemeModeToggle is a direct manifest leaf with serializable defaults', () => {"
          if 'Image is a direct manifest leaf with canonical media authoring metadata' not in component_test:
              component_test = component_test.replace(test_anchor, image_test + test_anchor, 1)
          component_test_path.write_text(component_test)

          bindable_test_path = Path('src/metadata/bindableComponentMeta.test.ts')
          bindable_test = bindable_test_path.read_text()
          component_import = "import { ZORA_COMPONENT_META } from './componentMeta';\n"
          bindable_import = "import { ZORA_BINDABLE_COMPONENT_META } from './bindableComponentMeta';\n"
          if component_import not in bindable_test:
              bindable_test = bindable_test.replace(bindable_import, bindable_import + component_import, 1)
          old_assertion = "    expect(registry.Image?.bindings?.props?.source?.value.type).toBe('imageAsset');\n"
          new_assertions = '\n'.join([
              '    expect(registry.Image?.props.source).toMatchObject({',
              "      type: 'media',",
              "      mediaKinds: ['image'],",
              '    });',
              '    expect(registry.Image?.props).toEqual(ZORA_COMPONENT_META.Image.props);',
              '    expect(registry.Image?.directManifestNode).toBe(ZORA_COMPONENT_META.Image.directManifestNode);',
              "    expect(registry.Image?.bindings?.props?.source?.value.type).toBe('imageAsset');",
              '',
          ])
          if old_assertion in bindable_test:
              bindable_test = bindable_test.replace(old_assertion, new_assertions, 1)
          bindable_test_path.write_text(bindable_test)
          PY

      - name: Update lockfile
        run: bun install

      - name: Format authored changes
        run: bun run format

      - name: Apply strict lint fixes
        run: bun run lint:fix

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Knip
        run: bun run knip

      - name: Generate documentation
        run: bun run docs

      - name: Format generated documentation
        run: bun run format

      - name: Validate repository conventions
        run: bunx @ankhorage/doctor@0.8.0 validate .

      - name: Verify formatting
        run: bun run format:check

      - name: Verify lint
        run: bun run lint

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify changeset
        run: bun run changeset:status

      - name: Guard generated documentation paths
        run: |
          if grep -R -E '/home/runner/work/|/Users/[^/]+/.*/node_modules/|[A-Za-z]:\\Users\\[^\\]+\\.*node_modules\\' README.md paradox; then
            echo 'Generated docs contain machine-specific paths.'
            exit 1
          fi

      - name: Verify clean patches
        run: git diff --check

      - name: Remove temporary gate workflow
        run: rm .github/workflows/adm14-media-metadata-gate.yml

      - name: Commit validated ZORA media metadata state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Validate ADM-14 ZORA media metadata'
          git push origin HEAD:agent/adm14-media-metadata
