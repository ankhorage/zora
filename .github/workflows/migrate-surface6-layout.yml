name: Surface 6 Layout Migration

on:
  push:
    branches:
      - refactor/surface-6-layout-primitives

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/surface-6-layout-primitives

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install current dependencies
        run: bun install --frozen-lockfile

      - name: Apply Surface 6 layout migration
        run: python3 .github/migrate_surface6_layout.py

      - name: Refresh dependencies
        run: bun install

      - name: Format migrated sources
        run: bun run format

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "refactor(layout): adopt Surface 6 primitives"
          git push origin HEAD:refactor/surface-6-layout-primitives
