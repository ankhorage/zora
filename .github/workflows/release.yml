name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      versioned: ${{ steps.release.outputs.versioned }}
      package_name: ${{ steps.release.outputs.package_name }}
      package_version: ${{ steps.release.outputs.package_version }}
      release_sha: ${{ steps.commit-release.outputs.release_sha }}

    steps:
      - name: Create the scoped release token
        id: release-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Diagnose unavailable scoped release token
        if: steps.release-token.outcome == 'failure'
        run: |
          echo "::error title=Renovate Sync App repository access required::Could not create the scoped Ankhorage release token for ${GITHUB_REPOSITORY}. Ensure the ankhorage-renovate-sync GitHub App is installed and authorized for this repository, then rerun Release. Bootstrap policy: https://github.com/ankhorage/renovate/issues/115"
          exit 1

      - name: Create the Renovate snapshot token
        id: renovate-snapshot-token
        if: vars.ANKHORAGE_PRE_PUBLISH_SNAPSHOT_GATE_ENABLED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          repositories: renovate
          permission-contents: write

      - name: Diagnose unavailable Renovate snapshot token
        if: vars.ANKHORAGE_PRE_PUBLISH_SNAPSHOT_GATE_ENABLED == 'true' && steps.renovate-snapshot-token.outcome == 'failure'
        run: |
          echo "::error title=Renovate snapshot access required::Could not create the Renovate-scoped token needed to dispatch and read the durable release-wave ACK. Ensure the ankhorage-renovate-sync GitHub App has Contents: write access to ankhorage/renovate, then rerun Release."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Synchronize latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node for npm publishing
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install declared Playwright Chromium
        run: |
          if node -e "const p=require('./package.json'); const sections=['dependencies','devDependencies','optionalDependencies']; process.exit(sections.some((section) => typeof p[section]?.['playwright-core'] === 'string') ? 0 : 1)"; then
            playwright_package="$(node -p "require.resolve('playwright-core/package.json')")"
            playwright_cli="$(dirname "$playwright_package")/cli.js"
            bun "$playwright_cli" install chromium
          else
            echo "No Playwright Core dependency declared; skipping Chromium installation."
          fi

      - name: Build package
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            bun run build
          else
            echo "No build script found; skipping."
          fi

      - name: Validate owner-defined packed consumer
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['test:packed-consumer'] ? 0 : 1)"; then
            bun run test:packed-consumer
          else
            echo "No packed consumer test declared; skipping."
          fi

      - name: Verify npm release baseline
        id: release-baseline
        if: hashFiles('.changeset/config.json') != ''
        run: |
          package_name="$(node -p "require('./package.json').name")"
          current_version="$(node -p "require('./package.json').version")"
          registry_evidence="${RUNNER_TEMP}/npm-release-versions.json"
          registry_error="${RUNNER_TEMP}/npm-release-versions.error"

          if npm view "$package_name" versions --json > "$registry_evidence" 2> "$registry_error"; then
            highest_published_version="$(node -e '
              const raw = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
              const parse = (value) => /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u.exec(value)?.slice(1).map(Number);
              const compare = (left, right) => {
                const index = left.findIndex((part, candidate) => part !== right[candidate]);
                return index === -1 ? 0 : left[index] - right[index];
              };
              const versions = Array.isArray(raw) ? raw : typeof raw === "string" ? [raw] : undefined;
              if (versions === undefined || versions.length === 0 || versions.some((value) => typeof value !== "string")) {
                throw new Error("npm registry returned an invalid version list.");
              }
              const stable = versions.filter((value) => parse(value));
              if (stable.length === 0) throw new Error("npm registry returned no stable published version.");
              stable.sort((left, right) => compare(parse(left), parse(right)));
              process.stdout.write(stable.at(-1) ?? "");
            ' "$registry_evidence")"
          elif PACKAGE_NAME="$package_name" node -e '
            const { readFileSync } = require("node:fs");
            const error = readFileSync(process.argv[1], "utf8");
            const packageName = process.env.PACKAGE_NAME;
            const notFoundRequest = /^npm error 404 Not Found - GET (https:\/\/registry\.npmjs\.org\/[^\s?#]+) - Not found$/mu.exec(error);
            const requestedPackage = notFoundRequest === null ? undefined : decodeURIComponent(new URL(notFoundRequest[1]).pathname.slice(1));
            const packageNotFound =
              /^npm error code E404$/mu.test(error) &&
              requestedPackage === packageName;
            process.exit(packageNotFound ? 0 : 1);
          ' "$registry_error"; then
            highest_published_version=""
          else
            echo "::error title=npm release baseline unavailable::Could not determine the highest published version for $package_name. Refusing to version or publish without registry evidence."
            exit 1
          fi

          if [ -n "$highest_published_version" ]; then
            CURRENT_VERSION="$current_version" HIGHEST_PUBLISHED_VERSION="$highest_published_version" node -e '
              const parse = (value) => value.split(".").map(Number);
              const current = parse(process.env.CURRENT_VERSION);
              const highest = parse(process.env.HIGHEST_PUBLISHED_VERSION);
              const index = current.findIndex((part, candidate) => part !== highest[candidate]);
              if (index !== -1 && current[index] < highest[index]) {
                throw new Error(`Package version rollback: ${process.env.CURRENT_VERSION} is lower than published npm version ${process.env.HIGHEST_PUBLISHED_VERSION}. Restore main to the published baseline before applying pending Changesets.`);
              }
            '
          fi
          echo "highest_published_version=$highest_published_version" >> "$GITHUB_OUTPUT"

      - name: Detect published release recovery
        id: published-release-recovery
        if: hashFiles('.changeset/config.json') != ''
        env:
          HIGHEST_PUBLISHED_VERSION: ${{ steps.release-baseline.outputs.highest_published_version }}
        run: |
          echo "recovery=false" >> "$GITHUB_OUTPUT"
          if [ -n "$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)" ]; then
            exit 0
          fi

          current_version="$(node -p "require('./package.json').version")"
          release_sha=""
          for candidate_sha in $(git rev-list HEAD); do
            candidate_subject="$(git show -s --format=%s "$candidate_sha")"
            if [ "$candidate_subject" != "chore(release): version packages [skip ci]" ]; then
              continue
            fi
            candidate_version="$(git show "${candidate_sha}:package.json" | node -e "let s=''; process.stdin.on('data',(d)=>s+=d); process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version ?? ''))")"
            if [ "$candidate_version" = "$current_version" ]; then
              release_sha="$candidate_sha"
              break
            fi
          done

          if [ -z "$release_sha" ]; then
            exit 0
          fi

          release_tag="v$current_version"
          tagged_sha="$(git rev-parse -q --verify "refs/tags/${release_tag}^{commit}" 2>/dev/null || true)"
          if [ -n "$tagged_sha" ] && [ "$tagged_sha" != "$release_sha" ]; then
            echo "::error title=Release tag mismatch::${release_tag} points to ${tagged_sha}, expected ${release_sha}."
            exit 1
          fi

          if [ "$HIGHEST_PUBLISHED_VERSION" = "$current_version" ]; then
            echo "Validated published release recovery for ${release_tag} at ${release_sha}; skipping package capability synchronization."
            echo "recovery=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize package capability metadata
        if: steps.published-release-recovery.outputs.recovery != 'true'
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.ankh === undefined ? 1 : 0)"; then
            if node -e "const p=require('./package.json'); process.exit(p.name === '@ankhorage/devtools' ? 0 : 1)"; then
              bun ./dist/cli/bin/repository.js package sync .
              bun ./dist/cli/bin/repository.js package status .
            else
              bun ./node_modules/.bin/ankhorage-repository package sync .
              bun ./node_modules/.bin/ankhorage-repository package status .
            fi
          else
            echo "No Ankh package metadata found; skipping capability materialization."
          fi

      - name: Validate release contract
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.name === '@ankhorage/doctor' ? 0 : 1)"; then
            bun ./dist/cli/standalone.js validate . --enforce-repository-metadata
          else
            BUN_INSTALL_CACHE_DIR="${RUNNER_TEMP}/doctor-cache" bunx @ankhorage/doctor@0.15.16 validate . --enforce-repository-metadata
          fi

      - name: Determine immutable pre-publish release intent
        id: pre-publish-release-intent
        if: hashFiles('.changeset/config.json') != '' && vars.ANKHORAGE_PRE_PUBLISH_SNAPSHOT_GATE_ENABLED == 'true' && steps.published-release-recovery.outputs.recovery != 'true'
        run: |
          changesets_status_path="$RUNNER_TEMP/changesets-status.json"
          bun ./node_modules/.bin/changeset status --output="$changesets_status_path" >/dev/null
          release_intent="$(CHANGESETS_STATUS_PATH="$changesets_status_path" node -e '
            const { readFileSync } = require("node:fs");
            const status = JSON.parse(readFileSync(process.env.CHANGESETS_STATUS_PATH, "utf8"));
            if (!Array.isArray(status.releases)) {
              throw new Error("Changesets status is missing an explicit releases list.");
            }
            if (status.releases.length > 1) {
              throw new Error("Changesets status must contain exactly one release or an explicit empty list.");
            }
            process.stdout.write(status.releases.length === 0 ? "false" : "true");
          '")"
          echo "release_intent=$release_intent" >> "$GITHUB_OUTPUT"

      - name: Acknowledge immutable pre-publish release-wave snapshot
        if: hashFiles('.changeset/config.json') != '' && vars.ANKHORAGE_PRE_PUBLISH_SNAPSHOT_GATE_ENABLED == 'true' && steps.published-release-recovery.outputs.recovery != 'true' && steps.pre-publish-release-intent.outputs.release_intent == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.renovate-snapshot-token.outputs.token }}
          RELEASE_WAVE_STATE_BRANCH: ${{ vars.ANKHORAGE_RELEASE_WAVE_STATE_BRANCH }}
        run: |
          test -n "$RELEASE_WAVE_STATE_BRANCH" || { echo "::error title=Release-wave state branch required::Provision the Renovate state branch before enabling the pre-publish gate."; exit 1; }
          source_sha="$(git rev-parse HEAD)"
          changesets_status_path="$RUNNER_TEMP/changesets-status.json"
          test -f "$changesets_status_path" || { echo '::error title=Changesets status missing::Release intent evidence was not retained.'; exit 1; }
          changesets_status_hash="$(sha256sum "$changesets_status_path" | cut -d ' ' -f 1)"
          request_id="${GITHUB_REPOSITORY//\//-}-${source_sha}-${changesets_status_hash}"
          payload="$(REQUEST_ID="$request_id" SOURCE_SHA="$source_sha" CHANGESETS_STATUS_HASH="$changesets_status_hash" node -e 'console.log(JSON.stringify({event_type:"pre-publish-release-wave-snapshot",client_payload:{requestId:process.env.REQUEST_ID,sourceRepository:process.env.GITHUB_REPOSITORY,sourceSha:process.env.SOURCE_SHA,changesetsStatusHash:process.env.CHANGESETS_STATUS_HASH}}))')"
          REQUEST_ID="$request_id" SOURCE_SHA="$source_sha" CHANGESETS_STATUS_HASH="$changesets_status_hash" \
            curl --fail-with-body --retry 3 --retry-all-errors -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/ankhorage/renovate/dispatches" -d "$payload"
          for attempt in $(seq 1 30); do
            ack_path="$RUNNER_TEMP/release-wave-ack.json"
            ack_status="$(curl --silent --show-error --output "$ack_path" --write-out '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/ankhorage/renovate/contents/.github/release-wave-publisher-snapshot-acks/${request_id}.json?ref=${RELEASE_WAVE_STATE_BRANCH}")" || { echo '::error title=Release-wave ACK read failed::Could not read the durable Renovate ACK.'; exit 1; }
            if [ "$ack_status" = 200 ]; then
              ack="$(cat "$ack_path")"
            elif [ "$ack_status" = 404 ]; then
              ack=""
            else
              cat "$ack_path"
              echo "::error title=Release-wave ACK read rejected::Renovate returned HTTP ${ack_status} while reading the durable ACK."
              exit 1
            fi
            if [ -n "$ack" ] && ACK="$ack" REQUEST_ID="$request_id" SOURCE_SHA="$source_sha" CHANGESETS_STATUS_HASH="$changesets_status_hash" node -e 'const ack=JSON.parse(Buffer.from(JSON.parse(process.env.ACK).content,"base64").toString("utf8")); if (ack.requestId!==process.env.REQUEST_ID || ack.sourceSha!==process.env.SOURCE_SHA || ack.changesetsStatusHash!==process.env.CHANGESETS_STATUS_HASH || !/^[a-f0-9]{64}$/.test(ack.epochId)) process.exit(1);'; then break; fi
            [ "$attempt" = 30 ] && { echo "::error title=Release-wave ACK timeout::No matching durable Renovate ACK arrived."; exit 1; }
            sleep 2
          done
          test "$(git rev-parse HEAD)" = "$source_sha" || { echo '::error title=Source changed::Release source changed while awaiting ACK.'; exit 1; }
          changesets_recheck_path="$RUNNER_TEMP/changesets-status-recheck.json"
          bun ./node_modules/.bin/changeset status --output="$changesets_recheck_path" >/dev/null
          latest_hash="$(sha256sum "$changesets_recheck_path" | cut -d ' ' -f 1)"
          test "$latest_hash" = "$changesets_status_hash" || { echo '::error title=Changesets changed::Release intent changed while awaiting ACK.'; exit 1; }

      - name: Prepare versioned release candidate
        id: release
        if: hashFiles('.changeset/config.json') != ''
        env:
          HIGHEST_PUBLISHED_VERSION: ${{ steps.release-baseline.outputs.highest_published_version }}
        run: |
          if [ -z "$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)" ]; then
            current_version="$(node -p "require('./package.json').version")"
            release_sha=""
            for candidate_sha in $(git rev-list HEAD); do
              candidate_subject="$(git show -s --format=%s "$candidate_sha")"
              if [ "$candidate_subject" != "chore(release): version packages [skip ci]" ]; then
                continue
              fi
              candidate_version="$(git show "${candidate_sha}:package.json" | node -e "let s=''; process.stdin.on('data',(d)=>s+=d); process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version ?? ''))")"
              if [ "$candidate_version" = "$current_version" ]; then
                release_sha="$candidate_sha"
                break
              fi
            done

            if [ -n "$release_sha" ]; then
              release_tag="v$current_version"
              tagged_sha="$(git rev-parse -q --verify "refs/tags/${release_tag}^{commit}" 2>/dev/null || true)"
              if [ -n "$tagged_sha" ] && [ "$tagged_sha" != "$release_sha" ]; then
                echo "::error title=Release tag mismatch::${release_tag} points to ${tagged_sha}, expected ${release_sha}."
                exit 1
              fi

              if [ "$HIGHEST_PUBLISHED_VERSION" != "$current_version" ]; then
                release_sha="$(git rev-parse HEAD)"
                echo "Completing unpublished ${release_tag} from current main ${release_sha} without another version bump."
              elif [ -n "$tagged_sha" ]; then
                echo "Release tag ${release_tag} already points to ${release_sha}; resuming idempotent finalization."
              else
                echo "Recovering canonical release commit $release_sha for version $current_version without another version bump."
              fi

              if [ "$HIGHEST_PUBLISHED_VERSION" = "$current_version" ] && (! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]); then
                git status --short
                echo "::error title=Release recovery requires a clean worktree::A release preparation step modified the checkout before recovery. Refusing to discard changes while switching to canonical release commit $release_sha."
                exit 1
              fi

              if [ "$HIGHEST_PUBLISHED_VERSION" = "$current_version" ]; then
                git checkout --detach "$release_sha"
              fi
              echo "versioned=true" >> "$GITHUB_OUTPUT"
              echo "package_name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
              echo "package_version=$current_version" >> "$GITHUB_OUTPUT"
              echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
            else
              echo "versioned=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          before_version="$(node -p "require('./package.json').version")"
          bun run version-packages
          if node -e "const p=require('./package.json'); process.exit(p.ankh?.apm === undefined ? 1 : 0)"; then
            ./node_modules/.bin/ankhorage-apm-release sync .
          fi
          after_version="$(node -p "require('./package.json').version")"

          if [ -n "$HIGHEST_PUBLISHED_VERSION" ]; then
            CANDIDATE_VERSION="$after_version" HIGHEST_PUBLISHED_VERSION="$HIGHEST_PUBLISHED_VERSION" node -e '
              const parse = (value) => value.split(".").map(Number);
              const candidate = parse(process.env.CANDIDATE_VERSION);
              const highest = parse(process.env.HIGHEST_PUBLISHED_VERSION);
              const index = candidate.findIndex((part, candidateIndex) => part !== highest[candidateIndex]);
              if (index === -1 || candidate[index] < highest[index]) {
                throw new Error(`Release version ${process.env.CANDIDATE_VERSION} must be strictly greater than published npm version ${process.env.HIGHEST_PUBLISHED_VERSION}. Refusing to create a duplicate or rollback release.`);
              }
            '
          fi

          if [ "$before_version" != "$after_version" ]; then
            if node -e "const p=require('./package.json'); process.exit(p.ankh?.structure === undefined ? 1 : 0)"; then
              ./node_modules/.bin/ankhorage-structure build .
            fi
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.docs ? 0 : 1)"; then
              bun run docs
            else
              echo "No docs script found; skipping."
            fi
          fi

          if git diff --quiet; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$before_version" = "$after_version" ]; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
          else
            echo "versioned=true" >> "$GITHUB_OUTPUT"
            echo "package_name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
            echo "package_version=$after_version" >> "$GITHUB_OUTPUT"
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify standalone packed install
        if: steps.release.outputs.versioned == 'true'
        run: |
          set -euo pipefail
          # Changesets can intentionally update package metadata and the lockfile during versioning.
          bun install --ignore-scripts
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build?0:1)"; then
            bun run build
          fi
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['test:packed-consumer'] ? 0 : 1)"; then
            bun run test:packed-consumer
          fi
          pack_dir="$(mktemp -d "${RUNNER_TEMP}/standalone-pack.XXXXXX")"
          install_dir="$(mktemp -d "${RUNNER_TEMP}/standalone-install.XXXXXX")"
          optional_install_dir="$(mktemp -d "${RUNNER_TEMP}/standalone-optional-install.XXXXXX")"
          npm pack --ignore-scripts --pack-destination "$pack_dir" >/dev/null
          artifact="$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [ -z "$artifact" ]; then
            echo "::error title=Standalone pack failed::npm pack did not produce a package artifact."
            exit 1
          fi
          printf '{"name":"standalone-consumer","private":true,"version":"0.0.0"}\n' > "$install_dir/package.json"
          package_name="$(node -p "require('./package.json').name")"
          platform_toolchain_dependencies="$(node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const dependencies = manifest.dependencies ?? {};
          const peerDependencies = manifest.peerDependencies ?? {};
          const declared = dependencies.expo ?? peerDependencies.expo;
          const expoDeclarations = [dependencies.expo, peerDependencies.expo];
          const declaredContracts = [
            ['dependencies', dependencies],
            ['peerDependencies', peerDependencies],
          ];
          const expoMajors = expoDeclarations.map((range) => {
            if (range === undefined) return undefined;
            const explicit = typeof range === 'string'
              ? /^(?:~|\^)?(\d+)\.(\d+)\.(\d+)$/.exec(range)
              : null;
            if (explicit === null) throw new Error('Expo must have an explicit bounded SDK version.');
            return Number(explicit[1]);
          });
          const expoModuleDeclarations = declaredContracts.flatMap(([source, contract]) => Object.entries(contract)
            .filter(([name]) => name === 'expo' || name.startsWith('expo-') || name === 'expo-router')
            .map(([name, range]) => `${source}.${name}=${String(range)}`));
          const resolveExpoSdkMajor = (name, range) => {
            if (typeof range !== 'string') return 0;
            const exact = /^(?:~|\^)?(\d+)\.0\.\d+$/.exec(range);
            if (exact !== null) return Number(exact[1]);
            if (name === 'expo-router') {
              const bounded = /^>=(\d+)\.0\.0 <(\d+)\.0\.0$/.exec(range);
              if (bounded !== null && Number(bounded[2]) === Number(bounded[1]) + 1) {
                return Number(bounded[1]);
              }
            }
            return 0;
          };
          const sdkMajors = new Set(declaredContracts.flatMap(([, contract]) => Object.entries(contract))
            .filter(([name]) => name.startsWith('expo-') || name === 'expo-router')
            .flatMap(([name, range]) => {
              const major = resolveExpoSdkMajor(name, range);
              return major >= 50 ? [major] : [];
            }));
          for (const major of expoMajors) if (major !== undefined) sdkMajors.add(major);
          if (sdkMajors.size > 1) {
            throw new Error(`Conflicting Expo SDK majors in the published package dependency contract: ${expoModuleDeclarations.join(', ')}.`);
          }
          const major = [...sdkMajors][0];
          const expo = declared ?? (major === undefined ? undefined : '~' + major + '.0.0');
          const react = dependencies.react ?? peerDependencies.react;
          const reactNative = dependencies['react-native'] ?? peerDependencies['react-native'];
          if (expo === undefined && react === undefined && reactNative === undefined) process.exit(0);
          if (typeof react !== 'string' || typeof reactNative !== 'string') {
            throw new Error(`React Native platform verification requires declared React and React Native versions; received React=${String(react)}, React Native=${String(reactNative)}.`);
          }
          process.stdout.write(JSON.stringify({
            ...(expo === undefined ? {} : { expo }),
            react,
            'react-native': reactNative,
          }));
          NODE
          )"
          capability_module_path="$(node --input-type=module -e "import { createRequire } from 'node:module'; console.log(createRequire(import.meta.resolve('@ankhorage/devtools/cli')).resolve('@ankhorage/capability'))")"
          (
            cd "$install_dir"
            bun add "$artifact" --ignore-scripts
            if [ -f node_modules/react/package.json ] && [ -f node_modules/react-dom/package.json ]; then
              react_version="$(node -p "require('./node_modules/react/package.json').version")"
              react_dom_version="$(node -p "require('./node_modules/react-dom/package.json').version")"
              if [ "$react_version" != "$react_dom_version" ]; then
                bun add "react-dom@$react_version" --ignore-scripts
              fi
            fi

            PACKAGE_NAME="$package_name" node - <<'NODE' > runtime-entrypoints.txt
          const { readFileSync } = require('node:fs');
          const { join } = require('node:path');
          const name = process.env.PACKAGE_NAME;
          const packageDir = join(process.cwd(), 'node_modules', ...name.split('/'));
          const pkg = JSON.parse(readFileSync(join(packageDir, 'package.json'), 'utf8'));
          const importConditions = new Set(['bun', 'default', 'import', 'node']);
          const requireConditions = new Set(['require']);
          const reactNativeConditions = new Set(['react-native']);
          const platformConditions = new Set(['browser', 'react-native']);
          const explicitServerConditions = new Set(['bun', 'node']);
          const supportsLoader = (target, conditions) => {
            if (typeof target === 'string') return true;
            if (Array.isArray(target)) return target.some((value) => supportsLoader(value, conditions));
            if (!target || typeof target !== 'object') return false;
            return Object.entries(target).some(
              ([condition, value]) =>
                conditions.has(condition) && supportsLoader(value, conditions),
            );
          };
          const declaresCondition = (target, conditions) => {
            if (Array.isArray(target)) {
              return target.some((value) => declaresCondition(value, conditions));
            }
            if (!target || typeof target !== 'object') return false;
            return Object.entries(target).some(
              ([condition, value]) =>
                conditions.has(condition) || declaresCondition(value, conditions),
            );
          };
          const isPlatformOnlyRuntimeTarget = (target) =>
            declaresCondition(target, platformConditions) &&
            !declaresCondition(target, explicitServerConditions);
          const isReactNativePlatformOnlyRuntimeTarget = (target) =>
            isPlatformOnlyRuntimeTarget(target) && declaresCondition(target, reactNativeConditions);
          const selectLoaders = (target) => {
            if (isReactNativePlatformOnlyRuntimeTarget(target)) return ['react-native'];
            if (isPlatformOnlyRuntimeTarget(target)) return [];
            return [
              ['import', importConditions],
              ['require', requireConditions],
            ].flatMap(([loader, conditions]) =>
              supportsLoader(target, conditions) ? [loader] : [],
            );
          };
          const records = [];
          const addEntrypoint = (specifier, target) => {
            for (const loader of selectLoaders(target)) {
              records.push(`${loader}|${specifier}`);
            }
          };
          const exportsMap = pkg.exports;
          if (exportsMap === undefined) {
            if (typeof pkg.main === 'string' || typeof pkg.module === 'string') {
              records.push(`import|${name}`);
            }
          } else if (
            typeof exportsMap === 'string' ||
            Array.isArray(exportsMap) ||
            (exportsMap &&
              typeof exportsMap === 'object' &&
              !Object.keys(exportsMap).some((key) => key.startsWith('.')))
          ) {
            addEntrypoint(name, exportsMap);
          } else if (exportsMap && typeof exportsMap === 'object') {
            for (const [key, target] of Object.entries(exportsMap)) {
              if (!key.startsWith('.') || key === './package.json' || key.includes('*')) continue;
              addEntrypoint(key === '.' ? name : `${name}/${key.slice(2)}`, target);
            }
          }
          const output = records.sort();
          process.stdout.write(output.length === 0 ? '' : `${output.join('\n')}\n`);
          NODE

            verify_react_native_export() {
              consumer_dir="$1"
              specifier="$2"
              platform_dir="$(mktemp -d "${consumer_dir}/packed-platform.XXXXXX")"
              platform_output_dir="$(mktemp -d "${RUNNER_TEMP}/standalone-platform-output.XXXXXX")"
              platform_temporary_directory="$(mktemp -d "${platform_dir}/tmp.XXXXXX")"
              printf '{"expo":{"name":"packed-platform-verification","slug":"packed-platform-verification"}}\n' > "$platform_dir/app.json"
              APP_DIR="$platform_dir" PACKAGE_SPECIFIER="$specifier" PLATFORM_TOOLCHAIN_DEPENDENCIES="$platform_toolchain_dependencies" node - <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const appDir = process.env.APP_DIR;
          const specifier = process.env.PACKAGE_SPECIFIER;
          const dependencies = process.env.PLATFORM_TOOLCHAIN_DEPENDENCIES;
          if (typeof appDir !== 'string' || typeof specifier !== 'string' || typeof dependencies !== 'string') {
            throw new Error('The platform verification app, package specifier, and toolchain are required.');
          }
          const toolchain = JSON.parse(dependencies);
          writeFileSync(
            join(appDir, 'package.json'),
            `${JSON.stringify({
              dependencies: toolchain,
              main: './App.tsx',
              name: 'packed-platform-verification',
              private: true,
              version: '0.0.0',
            })}\n`,
          );
          writeFileSync(join(appDir, 'App.tsx'), `export * from ${JSON.stringify(specifier)};\n`);
          if (typeof toolchain.expo !== 'string') {
            writeFileSync(
              join(appDir, 'metro.config.js'),
              "const { getDefaultConfig, mergeConfig } = require('@react-native/metro-config');\n\nmodule.exports = mergeConfig(getDefaultConfig(__dirname), {});\n",
            );
          }
          NODE
              (
                cd "$platform_dir"
                bun install --ignore-scripts
                if node -e "const dependencies=JSON.parse(process.argv[1]); process.exit(typeof dependencies.expo === 'string' ? 0 : 1)" "$platform_toolchain_dependencies"; then
                  metro_runtime_dependency="$(node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const expo = JSON.parse(readFileSync('./node_modules/expo/package.json', 'utf8'));
          const bundled = JSON.parse(readFileSync('./node_modules/expo/bundledNativeModules.json', 'utf8'));
          const peerRange = expo.peerDependencies?.['@expo/metro-runtime'];
          const compatibleRange = bundled['@expo/metro-runtime'];
          if (typeof peerRange !== 'string' || peerRange.length === 0 || typeof compatibleRange !== 'string' || compatibleRange.length === 0) {
            throw new Error('Expo platform verification requires the published Expo metadata for @expo/metro-runtime.');
          }
          process.stdout.write(`@expo/metro-runtime@${compatibleRange}`);
          NODE
                  )"
                  bun add "$metro_runtime_dependency" --ignore-scripts
                else
                  react_native_verification_dependencies="$(node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const reactNative = JSON.parse(readFileSync('./node_modules/react-native/package.json', 'utf8'));
          const match = /^0\.(\d+)\.\d+(?:[-+].*)?$/.exec(reactNative.version);
          if (match === null || Number(match[1]) < 81 || Number(match[1]) > 88) {
            throw new Error(`React Native-only platform verification supports resolved React Native 0.81 through 0.88; received ${String(reactNative.version)}.`);
          }
          process.stdout.write(`@react-native-community/cli@^20.0.0\n@react-native/metro-config@${reactNative.version}`);
          NODE
                  )"
                  printf '%s\n' "$react_native_verification_dependencies" | while IFS= read -r dependency; do
                    bun add "$dependency" --ignore-scripts
                  done
                fi
                bun add "$artifact" --ignore-scripts
                optional_platform_peer_dependencies="$(PACKAGE_NAME="$package_name" node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const { join } = require('node:path');
          const name = process.env.PACKAGE_NAME;
          if (typeof name !== 'string' || name.length === 0) {
            throw new Error('The packed package name is required for platform verification.');
          }
          const manifest = JSON.parse(
            readFileSync(join('node_modules', ...name.split('/'), 'package.json'), 'utf8'),
          );
          const peers = manifest.peerDependencies ?? {};
          const peerMetadata = manifest.peerDependenciesMeta ?? {};
          const optionalPeers = Object.entries(peerMetadata)
            .filter(([, metadata]) => metadata?.optional === true)
            .map(([dependency]) => {
              const version = peers[dependency];
              if (typeof version !== 'string' || version.length === 0) {
                throw new Error(`Optional peer ${dependency} must declare a peer dependency range.`);
              }
              return `${dependency}@${version}`;
            })
            .sort();
          process.stdout.write(optionalPeers.join('\n'));
          NODE
                )"
                if [ -n "$optional_platform_peer_dependencies" ]; then
                  printf '%s\n' "$optional_platform_peer_dependencies" | while IFS= read -r dependency; do
                    bun add "$dependency" --ignore-scripts
                  done
                fi
                if node -e "const dependencies=JSON.parse(process.argv[1]); process.exit(typeof dependencies.expo === 'string' ? 0 : 1)" "$platform_toolchain_dependencies"; then
                  node -e 'const p=require("./package.json"); for (const name of ["expo", "react", "react-native", "@expo/metro-runtime"]) { const resolved=require(`./node_modules/${name}/package.json`).version; console.log(`Expo platform toolchain ${name}: declared ${p.dependencies[name]}, resolved ${resolved}`); }'
                  TMPDIR="$platform_temporary_directory" "$platform_dir/node_modules/.bin/expo" export --platform ios --output-dir "$platform_output_dir"
                else
                  node -e 'const p=require("./package.json"); for (const name of ["react", "react-native", "@react-native-community/cli", "@react-native/metro-config"]) { const resolved=require(`./node_modules/${name}/package.json`).version; console.log(`React Native platform toolchain ${name}: declared ${p.dependencies[name] ?? "temporary verification dependency"}, resolved ${resolved}`); }'
                  TMPDIR="$platform_temporary_directory" "$platform_dir/node_modules/.bin/react-native" bundle --entry-file App.tsx --platform ios --bundle-output "$platform_output_dir/index.js" --dev false
                fi
              )
            }

            root_runtime_entrypoints="$(awk -F '|' -v package_name="$package_name" '$2 == package_name { print }' runtime-entrypoints.txt)"
            if [ -n "$root_runtime_entrypoints" ]; then
              (
                cd "$optional_install_dir"
                printf '{"name":"standalone-optional-consumer","private":true,"version":"0.0.0"}\n' > package.json
                bun add "$artifact" --ignore-scripts --omit optional
                printf '%s\n' "$root_runtime_entrypoints" | while IFS='|' read -r root_runtime_loader root_runtime_specifier; do
                  case "$root_runtime_loader" in
                    react-native)
                      if verify_react_native_export "$optional_install_dir" "$root_runtime_specifier"; then
                        echo "Verified React Native optional-isolation export $root_runtime_specifier with Expo."
                        continue
                      fi
                      echo "::error title=Packed optional-isolation React Native export failed::$root_runtime_specifier could not compile with Expo."
                      exit 1
                      ;;
                    import)
                      root_runtime_log="$(mktemp "${RUNNER_TEMP}/standalone-optional-runtime.XXXXXX")"
                      if PACKAGE_SPECIFIER="$root_runtime_specifier" bun -e 'await import(process.env.PACKAGE_SPECIFIER)' >"$root_runtime_log" 2>&1; then
                        continue
                      fi

                      if grep -Fq 'react-native/index.js' "$root_runtime_log" && grep -Fq 'Unexpected typeof' "$root_runtime_log"; then
                        if verify_react_native_export "$optional_install_dir" "$root_runtime_specifier"; then
                          echo "Verified React Native optional-isolation export $root_runtime_specifier with Expo."
                          continue
                        fi
                      fi

                      cat "$root_runtime_log"
                      echo "::error title=Packed optional-isolation root export failed::$root_runtime_specifier could not load with Bun or compile with Expo."
                      exit 1
                      ;;
                    require)
                      PACKAGE_SPECIFIER="$root_runtime_specifier" node -e 'require(process.env.PACKAGE_SPECIFIER)'
                      ;;
                    *)
                      echo "::error title=Unsupported packed root loader::Unexpected loader '$root_runtime_loader' for $root_runtime_specifier."
                      exit 1
                      ;;
                  esac
                done
              )
            fi

            PACKAGE_NAME="$package_name" CAPABILITY_MODULE_PATH="$capability_module_path" node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const name = process.env.PACKAGE_NAME;
          const packageDir = join(process.cwd(), 'node_modules', ...name.split('/'));
          const manifest = JSON.parse(readFileSync(join(packageDir, 'package.json'), 'utf8'));
          if (
            !manifest.ankh ||
            typeof manifest.ankh !== 'object' ||
            !Object.hasOwn(manifest.ankh, 'capabilities')
          ) process.exit(0);
          const capabilityPath = process.env.CAPABILITY_MODULE_PATH;
          if (typeof capabilityPath !== 'string' || capabilityPath.length === 0) {
            throw new Error('The release capability validator module path is required.');
          }
          const { areCapabilitiesEqual, isCapability, normalizeCapability } = await import(pathToFileURL(capabilityPath).href);
          const { CAPABILITIES } = await import(`${name}/capabilities`);
          const metadata = manifest.ankh.capabilities;
          if (!Array.isArray(CAPABILITIES) || !Array.isArray(metadata) ||
              !CAPABILITIES.every(isCapability) || !metadata.every(isCapability) ||
              CAPABILITIES.length !== metadata.length ||
              !CAPABILITIES.every((capability, index) => areCapabilitiesEqual(normalizeCapability(capability), metadata[index]))) {
            throw new Error('Packed package.json ankh.capabilities must exactly match the public CAPABILITIES catalog.');
          }
          NODE

            while IFS='|' read -r loader specifier; do
              if [ -z "$specifier" ]; then
                continue
              fi
              case "$loader" in
                react-native)
                  if verify_react_native_export "$install_dir" "$specifier"; then
                    echo "Verified React Native export $specifier with Expo."
                    continue
                  fi
                  echo "::error title=Packed React Native export failed::$specifier could not compile with Expo."
                  exit 1
                  ;;
                import)
                  runtime_log="$(mktemp "${RUNNER_TEMP}/standalone-runtime.XXXXXX")"
                  if PACKAGE_SPECIFIER="$specifier" bun -e 'await import(process.env.PACKAGE_SPECIFIER)' >"$runtime_log" 2>&1; then
                    continue
                  fi

                  if grep -Fq 'react-native/index.js' "$runtime_log" && grep -Fq 'Unexpected typeof' "$runtime_log"; then
                    if verify_react_native_export "$install_dir" "$specifier"; then
                      echo "Verified React Native export $specifier with Expo."
                      continue
                    fi
                  fi

                  cat "$runtime_log"
                  echo "::error title=Packed runtime export failed::$specifier could not load with Bun or compile with Expo."
                  exit 1
                  ;;
                require)
                  PACKAGE_SPECIFIER="$specifier" node -e 'require(process.env.PACKAGE_SPECIFIER)'
                  ;;
                *)
                  echo "::error title=Unsupported packed entrypoint loader::Unexpected loader '$loader' for $specifier."
                  exit 1
                  ;;
              esac
            done < runtime-entrypoints.txt

            PACKAGE_NAME="$package_name" node - <<'NODE' > binary-paths.txt
          const { readFileSync } = require('node:fs');
          const { join, resolve } = require('node:path');
          const name = process.env.PACKAGE_NAME;
          const packageDir = join(process.cwd(), 'node_modules', ...name.split('/'));
          const pkg = JSON.parse(readFileSync(join(packageDir, 'package.json'), 'utf8'));
          const binaries =
            typeof pkg.bin === 'string'
              ? [pkg.bin]
              : pkg.bin && typeof pkg.bin === 'object'
                ? Object.values(pkg.bin)
                : [];
          const paths = binaries
            .filter((value) => typeof value === 'string')
            .map((value) => resolve(packageDir, value))
            .sort();
          process.stdout.write(paths.length === 0 ? '' : `${paths.join('\n')}\n`);
          NODE

            while IFS= read -r binary_path; do
              if [ -z "$binary_path" ]; then
                continue
              fi

              binary_build_dir="$(mktemp -d "${RUNNER_TEMP}/standalone-bin-build.XXXXXX")"
              bun build "$binary_path" --target=bun --outdir "$binary_build_dir" >/dev/null

              binary_log="$(mktemp "${RUNNER_TEMP}/standalone-bin-smoke.XXXXXX")"
              set +e
              timeout 5s bun "$binary_path" </dev/null >"$binary_log" 2>&1
              binary_status=$?
              set -e

              if [ "$binary_status" -eq 124 ]; then
                echo "Declared binary $binary_path started successfully and remained active until the smoke timeout."
                continue
              fi

              if grep -Eiq 'Cannot find (package|module)|ERR_MODULE_NOT_FOUND|MODULE_NOT_FOUND|Could not resolve' "$binary_log"; then
                cat "$binary_log"
                echo "::error title=Packed binary runtime dependency missing::$binary_path could not resolve a runtime dependency."
                exit 1
              fi

              if [ "$binary_status" -eq 126 ] || [ "$binary_status" -eq 127 ]; then
                cat "$binary_log"
                echo "::error title=Packed binary failed to start::$binary_path exited with status $binary_status."
                exit 1
              fi

              echo "Declared binary $binary_path started without a missing-runtime-dependency failure (exit $binary_status)."
            done < binary-paths.txt
          )

      - name: Commit verified release candidate
        id: commit-release
        if: steps.release.outputs.versioned == 'true'
        run: |
          set -euo pipefail
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name "ankhorage-renovate-sync[bot]"
            git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
            git add --all
            git commit -m "chore(release): version packages [skip ci]"
            git push origin HEAD:main
          fi
          echo "package_name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "package_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish unpublished packages
        if: hashFiles('.changeset/config.json') != ''
        run: |
          if ! node -e "const p=require('./package.json'); process.exit(p.ankh?.apm === undefined ? 1 : 0)"; then
            package_name="$(node -p "require('./package.json').name")"
            package_version="$(node -p "require('./package.json').version")"
            registry_evidence="${RUNNER_TEMP}/npm-package-preflight.json"
            package_absent=false

            if npm view "$package_name" version --json > "$registry_evidence"; then
              :
            elif node -e "const p=require(process.argv[1]); if(p.error?.code !== 'E404') process.exit(1)" "$registry_evidence"; then
              package_absent=true
            else
              echo "::error title=npm registry preflight failed::Could not determine whether $package_name already exists in npm. Refusing to treat an authentication or network failure as first-publish bootstrap."
              exit 1
            fi

            if ! bun run changeset -- publish; then
              if [ "$package_absent" = true ]; then
                echo "::error title=npm scope publish access required::Initial publish of ${package_name}@${package_version} failed while the package is absent from npm. Verify that the configured npm publishing credential has Read and write (publish and stage) access to the @ankhorage scope or All Packages, then rerun Release. The already-versioned release commit on main is reusable; do not create another version bump. Bootstrap guidance: https://github.com/ankhorage/devtools/issues/225"
              fi
              exit 1
            fi
            exit 0
          fi

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          registry_evidence="${RUNNER_TEMP}/apm-registry.json"
          if npm view "${package_name}@${package_version}" version --json > "$registry_evidence"; then
            echo "Exact APM owner version is already published."
          else
            # Authentication/network errors must never be treated as an unpublished version.
            node -e "const p=require(process.argv[1]); if(p.error?.code !== 'E404') process.exit(1)" "$registry_evidence"
            bun install --ignore-scripts
            bun run build
            bun run test:apm
            artifact="$(mktemp -d "${RUNNER_TEMP}/apm-publish.XXXXXX")/candidate.tgz"
            ./node_modules/.bin/ankhorage-apm-release validate . --allow-owner-code --artifact "$artifact"
            npm publish "$artifact" --ignore-scripts
          fi
      - name: Skip release tooling
        if: hashFiles('.changeset/config.json') == ''
        run: echo "No Changesets config found; skipping versioning and publishing."

  verify-publication:
    needs: release
    if: needs.release.outputs.versioned == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Setup Node for npm verification
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@11.5.1

      - name: Verify published npm artifact from a fresh runner
        env:
          PUBLISHED_PACKAGE_NAME: ${{ needs.release.outputs.package_name }}
          PUBLISHED_PACKAGE_VERSION: ${{ needs.release.outputs.package_version }}
        run: |
          set -euo pipefail
          package_spec="${PUBLISHED_PACKAGE_NAME}@${PUBLISHED_PACKAGE_VERSION}"
          registry_evidence="${RUNNER_TEMP}/npm-publish-verification.json"
          registry_error="${RUNNER_TEMP}/npm-publish-verification.error"
          metadata_values="${RUNNER_TEMP}/npm-publish-verification.values"
          artifact="${RUNNER_TEMP}/npm-publish-verification.tgz"
          download_error="${RUNNER_TEMP}/npm-publish-verification.download.error"
          max_attempts=60
          retry_seconds=30

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Verifying ${package_spec} on npm (attempt ${attempt}/${max_attempts})..."
            if npm view "$package_spec" name version dist.tarball dist.integrity --json >"$registry_evidence" 2>"$registry_error"; then
              if ! node -e '
                const metadata = require(process.argv[1]);
                const fields = [metadata.name, metadata.version, metadata["dist.tarball"], metadata["dist.integrity"]];
                if (fields.some((field) => typeof field !== "string" || field.length === 0)) process.exit(1);
                for (const field of fields) console.log(field);
              ' "$registry_evidence" >"$metadata_values"; then
                echo "::error title=Invalid npm registry metadata::${package_spec} returned incomplete metadata."
                cat "$registry_evidence"
                exit 1
              fi

              package_name="$(sed -n '1p' "$metadata_values")"
              resolved_version="$(sed -n '2p' "$metadata_values")"
              tarball="$(sed -n '3p' "$metadata_values")"
              integrity="$(sed -n '4p' "$metadata_values")"
              if [ "$package_name" != "$PUBLISHED_PACKAGE_NAME" ] || [ "$resolved_version" != "$PUBLISHED_PACKAGE_VERSION" ] || [[ "$integrity" != sha512-* ]]; then
                echo "::error title=Wrong npm publication metadata::Expected ${package_spec} with SHA-512 integrity, received ${package_name}@${resolved_version}."
                exit 1
              fi

              if curl --fail --location --silent --show-error --output "$artifact" "$tarball" 2>"$download_error"; then
                if EXPECTED_INTEGRITY="$integrity" ARTIFACT="$artifact" node -e '
                  const { createHash } = require("node:crypto");
                  const { readFileSync } = require("node:fs");
                  const actual = `sha512-${createHash("sha512").update(readFileSync(process.env.ARTIFACT)).digest("base64")}`;
                  if (actual !== process.env.EXPECTED_INTEGRITY) {
                    console.error(`Expected ${process.env.EXPECTED_INTEGRITY}, received ${actual}.`);
                    process.exit(1);
                  }
                '; then
                  echo "Verified ${package_spec}: exact registry metadata, tarball download, and SHA-512 integrity."
                  exit 0
                fi

                echo "::error title=Wrong npm tarball::${package_spec} failed its registry SHA-512 integrity check."
                exit 1
              fi

              if grep -Eq '(^|[^0-9])40[13]([^0-9]|$)' "$download_error"; then
                echo "::error title=npm tarball authorization failed::Could not download ${package_spec}; verify registry credentials and access."
                cat "$download_error"
                exit 1
              fi
              if grep -Eq '(^|[^0-9])404([^0-9]|$)' "$download_error"; then
                echo "Tarball propagation is still pending for ${package_spec}."
              else
                echo "Tarball download failed due to a network or registry error."
                cat "$download_error"
              fi
            elif grep -Eq 'npm error code E(401|403)' "$registry_error"; then
              echo "::error title=npm registry authorization failed::Could not read ${package_spec}; verify registry credentials and access."
              cat "$registry_error"
              exit 1
            elif grep -Eq 'npm error code E404' "$registry_error"; then
              echo "Registry propagation is still pending for ${package_spec}."
            else
              echo "Registry metadata lookup failed due to a network or registry error."
              cat "$registry_error"
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$retry_seconds"
            fi
          done

          echo "::error title=npm publication propagation timeout::${package_spec} did not become independently retrievable after ${max_attempts} attempts."
          exit 1

  finalize:
    needs:
      - release
      - verify-publication
    if: needs.release.outputs.versioned == 'true' && needs.verify-publication.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Create the scoped release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.release_sha }}
          token: ${{ steps.release-token.outputs.token }}

      - name: Finalize Changesets v3 tag and GitHub release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          PUBLISHED_PACKAGE_VERSION: ${{ needs.release.outputs.package_version }}
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          tag="v${PUBLISHED_PACKAGE_VERSION}"
          remote_sha="$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)"

          if [ -n "$remote_sha" ]; then
            if [ "$remote_sha" != "$RELEASE_SHA" ]; then
              echo "Existing tag $tag points to $remote_sha, expected $RELEASE_SHA."
              exit 1
            fi
          else
            git tag "$tag" "$RELEASE_SHA"
            git push origin "refs/tags/$tag"
          fi

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --generate-notes --target "$RELEASE_SHA"
          fi

      - name: Create the scoped rollout token
        id: rollout-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          repositories: renovate
          permission-contents: write

      - name: Trigger the package consumer rollout
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PUBLISHED_PACKAGE_NAME: ${{ needs.release.outputs.package_name }}
          PUBLISHED_PACKAGE_VERSION: ${{ needs.release.outputs.package_version }}
          PUBLISHED_SOURCE_REPOSITORY: ${{ github.repository }}
        with:
          github-token: ${{ steps.rollout-token.outputs.token }}
          script: |
            const release = {
              name: process.env.PUBLISHED_PACKAGE_NAME,
              version: process.env.PUBLISHED_PACKAGE_VERSION,
              sourceRepository: process.env.PUBLISHED_SOURCE_REPOSITORY,
            };
            if (
              !/^@ankhorage\/[a-z0-9][a-z0-9-]*$/.test(release.name ?? '') ||
              typeof release.version !== 'string' ||
              release.version.length === 0 ||
              !/^ankhorage\/[a-z0-9-]+$/.test(release.sourceRepository ?? '')
            ) {
              throw new Error(
                'Changesets must report one exact published Ankhorage package identity.',
              );
            }

            await github.rest.repos.createDispatchEvent({
              owner: 'ankhorage',
              repo: 'renovate',
              event_type: 'package-release',
              client_payload: {
                package_name: release.name,
                version: release.version,
                source_repository: release.sourceRepository,
              },
            });
