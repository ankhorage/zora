name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      versioned: ${{ steps.release.outputs.versioned }}
      package_name: ${{ steps.release.outputs.package_name }}
      package_version: ${{ steps.release.outputs.package_version }}
      release_sha: ${{ steps.release.outputs.release_sha }}

    steps:
      - name: Create the scoped release token
        id: release-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Diagnose unavailable scoped release token
        if: steps.release-token.outcome == 'failure'
        run: |
          echo "::error title=Renovate Sync App repository access required::Could not create the scoped Ankhorage release token for ${GITHUB_REPOSITORY}. Ensure the ankhorage-renovate-sync GitHub App is installed and authorized for this repository, then rerun Release. Bootstrap policy: https://github.com/ankhorage/renovate/issues/115"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Synchronize latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node for npm publishing
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install

      - name: Build package
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            bun run build
          else
            echo "No build script found; skipping."
          fi

      - name: Synchronize package capability metadata
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.ankh === undefined ? 1 : 0)"; then
            if node -e "const p=require('./package.json'); process.exit(p.name === '@ankhorage/devtools' ? 0 : 1)"; then
              bun ./dist/cli/bin/repository.js package sync .
              bun ./dist/cli/bin/repository.js package status .
            else
              bunx --bun --no-install ankhorage-repository package sync .
              bunx --bun --no-install ankhorage-repository package status .
            fi
          else
            echo "No Ankh package metadata found; skipping capability materialization."
          fi

      - name: Validate release contract
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.name === '@ankhorage/doctor' ? 0 : 1)"; then
            bun ./dist/cli/standalone.js validate .
          else
            BUN_INSTALL_CACHE_DIR="${RUNNER_TEMP}/doctor-cache" bunx @ankhorage/doctor@0.14.13 validate .
          fi

      - name: Version packages directly on main
        id: release
        if: hashFiles('.changeset/config.json') != ''
        run: |
          if [ -z "$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)" ]; then
            current_version="$(node -p "require('./package.json').version")"
            release_sha=""
            for candidate_sha in $(git rev-list HEAD); do
              candidate_subject="$(git show -s --format=%s "$candidate_sha")"
              if [ "$candidate_subject" != "chore(release): version packages [skip ci]" ]; then
                continue
              fi
              candidate_version="$(git show "${candidate_sha}:package.json" | node -e "let s=''; process.stdin.on('data',(d)=>s+=d); process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version ?? ''))")"
              if [ "$candidate_version" = "$current_version" ]; then
                release_sha="$candidate_sha"
                break
              fi
            done

            if [ -n "$release_sha" ]; then
              release_tag="v$current_version"
              tagged_sha="$(git rev-parse -q --verify "refs/tags/${release_tag}^{commit}" 2>/dev/null || true)"
              if [ -n "$tagged_sha" ] && [ "$tagged_sha" != "$release_sha" ]; then
                echo "::error title=Release tag mismatch::${release_tag} points to ${tagged_sha}, expected ${release_sha}."
                exit 1
              fi

              if [ -n "$tagged_sha" ]; then
                echo "Release tag ${release_tag} already points to ${release_sha}; resuming idempotent finalization."
              else
                echo "Recovering canonical release commit $release_sha for version $current_version without another version bump."
              fi
              git checkout --detach "$release_sha"
              echo "versioned=true" >> "$GITHUB_OUTPUT"
              echo "package_name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
              echo "package_version=$current_version" >> "$GITHUB_OUTPUT"
              echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
            else
              echo "versioned=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          before_version="$(node -p "require('./package.json').version")"
          bun run version-packages
          if node -e "const p=require('./package.json'); process.exit(p.ankh?.apm === undefined ? 1 : 0)"; then
            ./node_modules/.bin/ankhorage-apm-release sync .
          fi
          after_version="$(node -p "require('./package.json').version")"

          if [ "$before_version" != "$after_version" ]; then
            if node -e "const p=require('./package.json'); process.exit(p.ankh?.structure === undefined ? 1 : 0)"; then
              ./node_modules/.bin/ankhorage-structure build .
            fi
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.docs ? 0 : 1)"; then
              bun run docs
            else
              echo "No docs script found; skipping."
            fi
          fi

          if git diff --quiet; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "ankhorage-renovate-sync[bot]"
          git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(release): version packages [skip ci]"
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

          if [ "$before_version" = "$after_version" ]; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
          else
            echo "versioned=true" >> "$GITHUB_OUTPUT"
            echo "package_name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
            echo "package_version=$after_version" >> "$GITHUB_OUTPUT"
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify standalone packed install
        if: steps.release.outputs.versioned == 'true'
        run: |
          set -euo pipefail
          bun install --ignore-scripts
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build?0:1)"; then
            bun run build
          fi
          pack_dir="$(mktemp -d "${RUNNER_TEMP}/standalone-pack.XXXXXX")"
          install_dir="$(mktemp -d "${RUNNER_TEMP}/standalone-install.XXXXXX")"
          npm pack --ignore-scripts --pack-destination "$pack_dir" >/dev/null
          artifact="$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [ -z "$artifact" ]; then
            echo "::error title=Standalone pack failed::npm pack did not produce a package artifact."
            exit 1
          fi
          printf '{"name":"standalone-consumer","private":true,"version":"0.0.0"}\n' > "$install_dir/package.json"
          package_name="$(node -p "require('./package.json').name")"
          (
            cd "$install_dir"
            bun add "$artifact" --ignore-scripts

            PACKAGE_NAME="$package_name" node - <<'NODE' > runtime-entrypoints.txt
          const { readFileSync } = require('node:fs');
          const { join } = require('node:path');
          const name = process.env.PACKAGE_NAME;
          const packageDir = join(process.cwd(), 'node_modules', ...name.split('/'));
          const pkg = JSON.parse(readFileSync(join(packageDir, 'package.json'), 'utf8'));
          const importConditions = new Set(['bun', 'default', 'import', 'node']);
          const requireConditions = new Set(['default', 'node', 'require']);
          const platformConditions = new Set(['browser', 'react-native']);
          const explicitServerConditions = new Set(['bun', 'node']);
          const supportsLoader = (target, conditions) => {
            if (typeof target === 'string') return true;
            if (Array.isArray(target)) return target.some((value) => supportsLoader(value, conditions));
            if (!target || typeof target !== 'object') return false;
            return Object.entries(target).some(
              ([condition, value]) =>
                conditions.has(condition) && supportsLoader(value, conditions),
            );
          };
          const declaresCondition = (target, conditions) => {
            if (Array.isArray(target)) {
              return target.some((value) => declaresCondition(value, conditions));
            }
            if (!target || typeof target !== 'object') return false;
            return Object.entries(target).some(
              ([condition, value]) =>
                conditions.has(condition) || declaresCondition(value, conditions),
            );
          };
          const isPlatformOnlyRuntimeTarget = (target) =>
            declaresCondition(target, platformConditions) &&
            !declaresCondition(target, explicitServerConditions);
          const selectLoader = (target) => {
            if (isPlatformOnlyRuntimeTarget(target)) return undefined;
            if (supportsLoader(target, importConditions)) return 'import';
            if (supportsLoader(target, requireConditions)) return 'require';
            return undefined;
          };
          const records = [];
          const addEntrypoint = (specifier, target) => {
            const loader = selectLoader(target);
            if (loader !== undefined) records.push(`${loader}|${specifier}`);
          };
          const exportsMap = pkg.exports;
          if (exportsMap === undefined) {
            if (typeof pkg.main === 'string' || typeof pkg.module === 'string') {
              records.push(`import|${name}`);
            }
          } else if (
            typeof exportsMap === 'string' ||
            Array.isArray(exportsMap) ||
            (exportsMap &&
              typeof exportsMap === 'object' &&
              !Object.keys(exportsMap).some((key) => key.startsWith('.')))
          ) {
            addEntrypoint(name, exportsMap);
          } else if (exportsMap && typeof exportsMap === 'object') {
            for (const [key, target] of Object.entries(exportsMap)) {
              if (!key.startsWith('.') || key === './package.json' || key.includes('*')) continue;
              addEntrypoint(key === '.' ? name : `${name}/${key.slice(2)}`, target);
            }
          }
          const output = records.sort();
          process.stdout.write(output.length === 0 ? '' : `${output.join('\n')}\n`);
          NODE

            PACKAGE_NAME="$package_name" node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const name = process.env.PACKAGE_NAME;
          const packageDir = join(process.cwd(), 'node_modules', ...name.split('/'));
          const manifest = JSON.parse(readFileSync(join(packageDir, 'package.json'), 'utf8'));
          if (
            !manifest.ankh ||
            typeof manifest.ankh !== 'object' ||
            !Object.hasOwn(manifest.ankh, 'capabilities')
          ) process.exit(0);
          const requireFromPackage = createRequire(join(packageDir, 'package.json'));
          const capabilityPath = requireFromPackage.resolve('@ankhorage/capability');
          const { areCapabilitiesEqual, isCapability, normalizeCapability } = await import(pathToFileURL(capabilityPath).href);
          const { CAPABILITIES } = await import(`${name}/capabilities`);
          const metadata = manifest.ankh.capabilities;
          if (!Array.isArray(CAPABILITIES) || !Array.isArray(metadata) ||
              !CAPABILITIES.every(isCapability) || !metadata.every(isCapability) ||
              CAPABILITIES.length !== metadata.length ||
              !CAPABILITIES.every((capability, index) => areCapabilitiesEqual(normalizeCapability(capability), metadata[index]))) {
            throw new Error('Packed package.json ankh.capabilities must exactly match the public CAPABILITIES catalog.');
          }
          NODE

            while IFS='|' read -r loader specifier; do
              if [ -z "$specifier" ]; then
                continue
              fi
              case "$loader" in
                import)
                  PACKAGE_SPECIFIER="$specifier" bun -e 'await import(process.env.PACKAGE_SPECIFIER)'
                  ;;
                require)
                  PACKAGE_SPECIFIER="$specifier" node -e 'require(process.env.PACKAGE_SPECIFIER)'
                  ;;
                *)
                  echo "::error title=Unsupported packed entrypoint loader::Unexpected loader '$loader' for $specifier."
                  exit 1
                  ;;
              esac
            done < runtime-entrypoints.txt

            PACKAGE_NAME="$package_name" node - <<'NODE' > binary-paths.txt
          const { readFileSync } = require('node:fs');
          const { join, resolve } = require('node:path');
          const name = process.env.PACKAGE_NAME;
          const packageDir = join(process.cwd(), 'node_modules', ...name.split('/'));
          const pkg = JSON.parse(readFileSync(join(packageDir, 'package.json'), 'utf8'));
          const binaries =
            typeof pkg.bin === 'string'
              ? [pkg.bin]
              : pkg.bin && typeof pkg.bin === 'object'
                ? Object.values(pkg.bin)
                : [];
          const paths = binaries
            .filter((value) => typeof value === 'string')
            .map((value) => resolve(packageDir, value))
            .sort();
          process.stdout.write(paths.length === 0 ? '' : `${paths.join('\n')}\n`);
          NODE

            while IFS= read -r binary_path; do
              if [ -z "$binary_path" ]; then
                continue
              fi

              binary_build_dir="$(mktemp -d "${RUNNER_TEMP}/standalone-bin-build.XXXXXX")"
              bun build "$binary_path" --target=bun --outdir "$binary_build_dir" >/dev/null

              binary_log="$(mktemp "${RUNNER_TEMP}/standalone-bin-smoke.XXXXXX")"
              set +e
              timeout 5s bun "$binary_path" </dev/null >"$binary_log" 2>&1
              binary_status=$?
              set -e

              if [ "$binary_status" -eq 124 ]; then
                echo "Declared binary $binary_path started successfully and remained active until the smoke timeout."
                continue
              fi

              if grep -Eiq 'Cannot find (package|module)|ERR_MODULE_NOT_FOUND|MODULE_NOT_FOUND|Could not resolve' "$binary_log"; then
                cat "$binary_log"
                echo "::error title=Packed binary runtime dependency missing::$binary_path could not resolve a runtime dependency."
                exit 1
              fi

              if [ "$binary_status" -eq 126 ] || [ "$binary_status" -eq 127 ]; then
                cat "$binary_log"
                echo "::error title=Packed binary failed to start::$binary_path exited with status $binary_status."
                exit 1
              fi

              echo "Declared binary $binary_path started without a missing-runtime-dependency failure (exit $binary_status)."
            done < binary-paths.txt
          )

      - name: Publish unpublished packages
        if: hashFiles('.changeset/config.json') != ''
        run: |
          if ! node -e "const p=require('./package.json'); process.exit(p.ankh?.apm === undefined ? 1 : 0)"; then
            package_name="$(node -p "require('./package.json').name")"
            package_version="$(node -p "require('./package.json').version")"
            registry_evidence="${RUNNER_TEMP}/npm-package-preflight.json"
            package_absent=false

            if npm view "$package_name" version --json > "$registry_evidence"; then
              :
            elif node -e "const p=require(process.argv[1]); if(p.error?.code !== 'E404') process.exit(1)" "$registry_evidence"; then
              package_absent=true
            else
              echo "::error title=npm registry preflight failed::Could not determine whether $package_name already exists in npm. Refusing to treat an authentication or network failure as first-publish bootstrap."
              exit 1
            fi

            if ! bun run changeset -- publish; then
              if [ "$package_absent" = true ]; then
                echo "::error title=npm scope publish access required::Initial publish of ${package_name}@${package_version} failed while the package is absent from npm. Verify that the configured npm publishing credential has Read and write (publish and stage) access to the @ankhorage scope or All Packages, then rerun Release. The already-versioned release commit on main is reusable; do not create another version bump. Bootstrap guidance: https://github.com/ankhorage/devtools/issues/225"
              fi
              exit 1
            fi
            exit 0
          fi

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          registry_evidence="${RUNNER_TEMP}/apm-registry.json"
          if npm view "${package_name}@${package_version}" version --json > "$registry_evidence"; then
            echo "Exact APM owner version is already published."
          else
            # Authentication/network errors must never be treated as an unpublished version.
            node -e "const p=require(process.argv[1]); if(p.error?.code !== 'E404') process.exit(1)" "$registry_evidence"
            bun install --ignore-scripts
            bun run build
            bun run test:apm
            artifact="$(mktemp -d "${RUNNER_TEMP}/apm-publish.XXXXXX")/candidate.tgz"
            ./node_modules/.bin/ankhorage-apm-release validate . --allow-owner-code --artifact "$artifact"
            npm publish "$artifact" --ignore-scripts
          fi
      - name: Skip release tooling
        if: hashFiles('.changeset/config.json') == ''
        run: echo "No Changesets config found; skipping versioning and publishing."

  verify-publication:
    needs: release
    if: needs.release.outputs.versioned == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node for npm verification
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Verify published npm artifact from a fresh runner
        env:
          PUBLISHED_PACKAGE_NAME: ${{ needs.release.outputs.package_name }}
          PUBLISHED_PACKAGE_VERSION: ${{ needs.release.outputs.package_version }}
        run: |
          set -euo pipefail
          package_spec="${PUBLISHED_PACKAGE_NAME}@${PUBLISHED_PACKAGE_VERSION}"
          registry_evidence="${RUNNER_TEMP}/npm-publish-verification.json"
          artifact="${RUNNER_TEMP}/npm-publish-verification.tgz"
          pack_dir="${RUNNER_TEMP}/npm-pack-verification"
          max_attempts=60
          retry_seconds=30
          mkdir -p "$pack_dir"

          last_stage="registry-metadata"
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Verifying ${package_spec} on npm (attempt ${attempt}/${max_attempts})..."
            last_stage="registry-metadata"

            if npm view "$package_spec" version dist.tarball dist.integrity --json > "$registry_evidence"; then
              resolved_version="$(node -e "const raw=require(process.argv[1]); const p=Array.isArray(raw)&&raw.length===1?raw[0]:raw; process.stdout.write(typeof p?.version==='string'?p.version:'')" "$registry_evidence")"
              tarball="$(node -e "const raw=require(process.argv[1]); const p=Array.isArray(raw)&&raw.length===1?raw[0]:raw; process.stdout.write(typeof p?.['dist.tarball']==='string'?p['dist.tarball']:'')" "$registry_evidence")"
              integrity="$(node -e "const raw=require(process.argv[1]); const p=Array.isArray(raw)&&raw.length===1?raw[0]:raw; process.stdout.write(typeof p?.['dist.integrity']==='string'?p['dist.integrity']:'')" "$registry_evidence")"

              if [ "$resolved_version" = "$PUBLISHED_PACKAGE_VERSION" ] && [ -n "$tarball" ] && [ -n "$integrity" ]; then
                last_stage="tarball-download"
                if curl --fail --location --silent --show-error --output "$artifact" "$tarball"; then
                  last_stage="integrity"
                  if EXPECTED_INTEGRITY="$integrity" ARTIFACT="$artifact" node -e "const { createHash }=require('node:crypto'); const { readFileSync }=require('node:fs'); const actual='sha512-'+createHash('sha512').update(readFileSync(process.env.ARTIFACT)).digest('base64'); if(actual!==process.env.EXPECTED_INTEGRITY){console.error('Downloaded npm tarball integrity mismatch.'); process.exit(1)}"; then
                    last_stage="npm-pack"
                    attempt_pack_dir="$pack_dir/attempt-${attempt}"
                    mkdir -p "$attempt_pack_dir"
                    if npm pack "$package_spec" --pack-destination "$attempt_pack_dir" >/dev/null; then
                      echo "Verified ${package_spec}: metadata, integrity, tarball download, and npm pack are available."
                      exit 0
                    fi
                  fi
                fi
              fi
            fi

            echo "Published npm artifact not ready at stage: ${last_stage}."
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$retry_seconds"
            fi
          done

          echo "Published npm artifact did not become retrievable after ${max_attempts} attempts; last stage: ${last_stage}."
          cat "$registry_evidence" 2>/dev/null || true
          exit 1

  finalize:
    needs:
      - release
      - verify-publication
    if: needs.release.outputs.versioned == 'true' && needs.verify-publication.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Create the scoped release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.release_sha }}
          token: ${{ steps.release-token.outputs.token }}

      - name: Finalize Changesets v3 tag and GitHub release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          PUBLISHED_PACKAGE_VERSION: ${{ needs.release.outputs.package_version }}
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          tag="v${PUBLISHED_PACKAGE_VERSION}"
          remote_sha="$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)"

          if [ -n "$remote_sha" ]; then
            if [ "$remote_sha" != "$RELEASE_SHA" ]; then
              echo "Existing tag $tag points to $remote_sha, expected $RELEASE_SHA."
              exit 1
            fi
          else
            git tag "$tag" "$RELEASE_SHA"
            git push origin "refs/tags/$tag"
          fi

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --generate-notes --target "$RELEASE_SHA"
          fi

      - name: Create the scoped rollout token
        id: rollout-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          repositories: renovate
          permission-contents: write

      - name: Trigger the package consumer rollout
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PUBLISHED_PACKAGE_NAME: ${{ needs.release.outputs.package_name }}
          PUBLISHED_PACKAGE_VERSION: ${{ needs.release.outputs.package_version }}
          PUBLISHED_SOURCE_REPOSITORY: ${{ github.repository }}
        with:
          github-token: ${{ steps.rollout-token.outputs.token }}
          script: |
            const release = {
              name: process.env.PUBLISHED_PACKAGE_NAME,
              version: process.env.PUBLISHED_PACKAGE_VERSION,
              sourceRepository: process.env.PUBLISHED_SOURCE_REPOSITORY,
            };
            if (
              !/^@ankhorage\/[a-z0-9][a-z0-9-]*$/.test(release.name ?? '') ||
              typeof release.version !== 'string' ||
              release.version.length === 0 ||
              !/^ankhorage\/[a-z0-9-]+$/.test(release.sourceRepository ?? '')
            ) {
              throw new Error(
                'Changesets must report one exact published Ankhorage package identity.',
              );
            }

            await github.rest.repos.createDispatchEvent({
              owner: 'ankhorage',
              repo: 'renovate',
              event_type: 'package-release',
              client_payload: {
                package_name: release.name,
                version: release.version,
                source_repository: release.sourceRepository,
              },
            });
