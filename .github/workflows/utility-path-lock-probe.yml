name: Utility 1.8.1 lock probe

on:
  pull_request:
    paths:
      - '.github/workflows/utility-path-lock-probe.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Resolve Utility 1.8.1
        run: |
          bun install --lockfile-only
          grep -F '"@ankhorage/utility": ["@ankhorage/utility@1.8.1"' bun.lock
          git diff -- bun.lock
