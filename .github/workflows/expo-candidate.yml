name: Expo candidate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install portable ZORA dependencies
        run: bun install --frozen-lockfile

      - name: Validate isolated example projects
        run: bun run examples:validate

      - name: Validate packed ZORA in Expo applications
        run: bun run expo:candidate
