name: Expo candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install portable ZORA dependencies
        run: bun install --frozen-lockfile

      - name: Validate isolated example projects
        run: bun run examples:validate

      - name: Validate packed ZORA in Expo applications
        run: bun run expo:candidate

      - name: Upload retained Expo candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: expo-candidate-diagnostics
          path: ${{ runner.temp }}/zora-expo-candidate-diagnostics-*/**
          if-no-files-found: warn
